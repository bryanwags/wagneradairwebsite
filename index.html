<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<title>Wagner-Adair</title>
<meta name="description" content="Bryan and Gwen Wagner-Adair. Find us online.">
<meta property="og:title" content="Wagner-Adair">
<meta property="og:description" content="Bryan and Gwen Wagner-Adair. Find us online.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2316181d'/%3E%3Ccircle cx='22' cy='32' r='10' fill='%238ea2ff'/%3E%3Ccircle cx='42' cy='32' r='10' fill='%23ff8fb0'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f8f8f6;
    --card: #ffffff;
    --ink: #14161a;
    --muted: #666b75;
    --line: #e3e4e7;
    --bryan: #c2410c;
    --gwen: #15803d;
    --shadow: 0 1px 2px rgba(20,22,26,.04), 0 8px 24px rgba(20,22,26,.05);
    --glow-a: rgba(194,65,12,.10);
    --glow-b: rgba(21,128,61,.10);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1013;
      --card: #15181d;
      --ink: #eceef2;
      --muted: #9299a5;
      --line: #252932;
      --bryan: #fb923c;
      --gwen: #4ade80;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
      --glow-a: rgba(251,146,60,.10);
      --glow-b: rgba(74,222,128,.08);
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background:
      radial-gradient(60% 50% at 0% 0%, var(--glow-a), transparent 70%),
      radial-gradient(60% 50% at 100% 0%, var(--glow-b), transparent 70%),
      var(--bg);
    background-repeat: no-repeat;
    color: var(--ink);
    font-family: "Avenir Next", "SF Pro Display", ui-sans-serif, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  main {
    max-width: 980px;
    margin: 0 auto;
    padding: clamp(48px, 10vh, 112px) 24px 32px;
  }

  header { animation: rise .6s ease both; }

  .mark { display: flex; gap: 6px; margin-bottom: 28px; }
  .mark i { width: 14px; height: 14px; border-radius: 50%; background: var(--bryan); }
  .mark i + i { background: var(--gwen); }

  h1 {
    margin: 0;
    font-size: clamp(2.6rem, 10vw, 5.5rem);
    font-weight: 600;
    line-height: 1;
    letter-spacing: -0.04em;
  }

  .lede { margin: 18px 0 0; font-size: 1.15rem; color: var(--muted); }

  .people {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-top: clamp(36px, 6vw, 64px);
  }

  .person {
    padding: 28px 28px 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
    animation: rise .6s ease both;
  }
  .person.gwen { animation-delay: .08s; }

  .bryan { --a: var(--bryan); }
  .gwen { --a: var(--gwen); }

  h2 {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0 0 12px;
    font-size: 1.6rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
  h2::before {
    content: "";
    flex: none;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--a);
  }

  ul { margin: 0; padding: 0; list-style: none; }
  li + li { border-top: 1px solid var(--line); }

  .person a {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding: 16px 0;
    color: inherit;
    text-decoration: none;
  }

  .label { font-size: 1.1rem; font-weight: 500; transition: color .2s ease; }

  .handle {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: .9rem;
    color: var(--muted);
    transition: color .2s ease;
  }
  .handle::after { content: " \2197"; opacity: 0; transition: opacity .2s ease; }

  .person a:hover .label,
  .person a:hover .handle,
  .person a:focus-visible .label,
  .person a:focus-visible .handle { color: var(--a); }
  .person a:hover .handle::after,
  .person a:focus-visible .handle::after { opacity: 1; }

  .person a:focus-visible {
    outline: 2px solid var(--a);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .contact {
    display: grid;
    grid-template-columns: 1fr 1.4fr;
    gap: clamp(24px, 5vw, 56px);
    margin-top: 20px;
    padding: clamp(24px, 4vw, 40px);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
    animation: rise .6s ease .16s both;
  }

  .contact h2::before { background: linear-gradient(90deg, var(--bryan) 50%, var(--gwen) 50%); }
  .contact-intro p { margin: 0; color: var(--muted); }

  .contact label {
    display: block;
    margin: 0 0 6px;
    font-size: .85rem;
    font-weight: 500;
    color: var(--muted);
  }

  .contact input,
  .contact textarea {
    display: block;
    width: 100%;
    margin: 0 0 18px;
    padding: 12px 14px;
    font: inherit;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    transition: border-color .2s ease, box-shadow .2s ease;
  }

  .contact textarea { min-height: 130px; resize: vertical; }

  .contact input:focus,
  .contact textarea:focus {
    outline: none;
    border-color: var(--ink);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink) 12%, transparent);
  }

  .contact button {
    padding: 12px 26px;
    font: inherit;
    font-weight: 500;
    color: var(--bg);
    background: var(--ink);
    border: 0;
    border-radius: 10px;
    cursor: pointer;
    transition: transform .15s ease, opacity .2s ease;
  }
  .contact button:hover { transform: translateY(-1px); }
  .contact button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .contact button:disabled { opacity: .6; cursor: default; transform: none; }

  .contact .hp { position: absolute; left: -9999px; }

  .status { margin: 14px 0 0; min-height: 1.5em; color: var(--muted); }

  footer { margin-top: 40px; padding-top: 20px; font-size: .85rem; color: var(--muted); }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }

  @media (max-width: 680px) {
    .people { grid-template-columns: 1fr; }
    .contact { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="mark" aria-hidden="true"><i></i><i></i></div>
    <h1>Wagner-Adair</h1>
    <p class="lede">Find us online.</p>
  </header>

  <div class="people">
    <section class="person bryan" aria-labelledby="bryan">
      <h2 id="bryan">Bryan</h2>
      <ul>
        <li>
          <a href="https://www.linkedin.com/in/bryanwagneradair/">
            <span class="label">LinkedIn</span>
            <span class="handle">in/bryanwagneradair</span>
          </a>
        </li>
      </ul>
    </section>

    <section class="person gwen" aria-labelledby="gwen">
      <h2 id="gwen">Gwen</h2>
      <ul>
        <li>
          <a href="https://www.linkedin.com/in/gwenwagneradair/">
            <span class="label">LinkedIn</span>
            <span class="handle">in/gwenwagneradair</span>
          </a>
        </li>
        <li>
          <a href="https://www.instagram.com/petitchoufleur/">
            <span class="label">Instagram</span>
            <span class="handle">@petitchoufleur</span>
          </a>
        </li>
      </ul>
    </section>
  </div>

  <section class="contact" aria-labelledby="contact">
    <div class="contact-intro">
      <h2 id="contact">Say hello</h2>
      <p>Send us a message and we'll get back to you.</p>
    </div>
    <form id="contact-form" action="https://formspree.io/f/xrpqanwe" method="POST">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" autocomplete="name" required>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" required></textarea>

      <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">

      <button type="submit">Send message</button>
      <p class="status" id="form-status" role="status" aria-live="polite"></p>
    </form>
  </section>

  <footer>&copy; <span id="yr">2026</span> Wagner-Adair</footer>
</main>
<script>
  document.getElementById("yr").textContent = new Date().getFullYear();
  (function () {
    var form = document.getElementById("contact-form");
    var status = document.getElementById("form-status");
    var button = form.querySelector("button");
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      button.disabled = true;
      status.textContent = "Sending…";
      fetch(form.action, {
        method: "POST",
        body: new FormData(form),
        headers: { Accept: "application/json" }
      }).then(function (r) {
        if (r.ok) {
          form.reset();
          status.textContent = "Thanks, your message has been sent.";
        } else {
          throw new Error("failed");
        }
      }).catch(function () {
        status.textContent = "Sorry, something went wrong. Please try again.";
      }).then(function () { button.disabled = false; });
    });
  })();
</script>
</body>
</html>
